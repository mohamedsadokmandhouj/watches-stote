<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Timeless Watches</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<style> 
input,textarea{  color :white !important; background-color: rgb(44, 43, 43) !important;}
    </style>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./products.html">Products</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <div style="padding: 70px;">
        <section class="contact-section">
            <div class="container">
                <h2 style="color: rgb(250, 250, 253);">Contact Us</h2>
                <form >
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="destination">Destination of Interest</label>
                        <input type="text" class="form-control" id="destination">
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea class="form-control" id="message" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
        </section>
    </div>
    <div style="text-align: end ; padding-right: 40px;">
        <a href="https://www.facebook.com/?locale=fr_FR">
            <i class="fa-brands fa-facebook fa-4x"></i>
        </a>
        <a href="https://www.instagram.com/">
          <i class="fa-brands fa-instagram fa-4x"></i>
        </a>
    </div>
    
    

    <footer class="footer">

          </footer>
